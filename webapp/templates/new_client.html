{% extends "base.html" %}
{% block title %}New Client{% endblock %}
{% block content %}
  <div class="page-header"><h1>New Client</h1></div>
  <form class="form-card" method="post">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>
      Your name
      <input type="text" name="name" placeholder="e.g. Alex Rivera" required>
    </label>
    <p class="hint">This is the host - remembered for them, so they won't be asked again during setup.</p>
    <button class="btn btn-primary" type="submit">Create Client</button>
  </form>
{% endblock %}
